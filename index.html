<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMAO Clan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #1b1b1b;
            color: #eeeeee;
        }

        /* Top navigation bar */
        .navbar {
            height: 75px;
            width: 100%;
            background: #111111;
            border-bottom: 1px solid #333333;
            display: flex;
            align-items: center;
            padding: 0 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
        }

        /* Logo */
        .logo {
            height: 55px;
            width: auto;
            object-fit: contain;
            margin-right: 45px;
        }

        /* Navigation tabs */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 100%;
        }

        .nav-links a {
            color: #bdbdbd;
            text-decoration: none;
            padding: 28px 20px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
            border-bottom: 3px solid transparent;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: #242424;
            border-bottom: 3px solid #888888;
        }

        /* Main content */
        .content {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .hero p {
            color: #929292;
            font-size: 18px;
        }

        /* Mobile */
        @media (max-width: 700px) {
            .navbar {
                height: auto;
                min-height: 75px;
                padding: 10px 15px;
                flex-wrap: wrap;
            }

            .logo {
                height: 45px;
                margin-right: 20px;
            }

            .nav-links {
                overflow-x: auto;
                width: 100%;
            }

            .nav-links a {
                padding: 20px 12px;
                white-space: nowrap;
                font-size: 13px;
            }

            .hero h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <img src="lmaocomplogo.png" alt="LMAO Clan Logo" class="logo">

        <div class="nav-links">
            <a href="#">Applications</a>
            <a href="#">Members</a>
            <a href="#">Hall of Clowns</a>
            <a href="#">Socials</a>
        </div>

    </nav>

    <main class="content">
        <section class="hero">
            <h1>LMAO</h1>
            <p>Welcome to the clan.</p>
        </section>
    </main>

</body>
</html>
